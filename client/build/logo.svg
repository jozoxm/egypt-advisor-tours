<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <!-- Background -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9B037;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Egyptian Eagle Design -->
  <g transform="translate(35, 50)">
    <!-- Eagle Body -->
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="url(#goldGradient)"/>
    
    <!-- Eagle Head -->
    <circle cx="0" cy="-14" r="6" fill="url(#goldGradient)"/>
    
    <!-- Eagle Beak -->
    <path d="M 0,-14 L 4,-16 L 0,-18 Z" fill="#8B7D2D"/>
    
    <!-- Eagle Eye -->
    <circle cx="1" cy="-15" r="1.5" fill="#2c2c2c"/>
    
    <!-- Left Wing -->
    <path d="M -8,0 Q -18,-8 -25,-4 Q -20,0 -18,2 Q -12,4 -8,2 Z" fill="url(#goldGradient)" stroke="#8B7D2D" stroke-width="0.5"/>
    <path d="M -10,-2 L -16,-5 M -12,0 L -18,-2 M -14,2 L -20,0" stroke="#8B7D2D" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Right Wing -->
    <path d="M 8,0 Q 18,-8 25,-4 Q 20,0 18,2 Q 12,4 8,2 Z" fill="url(#goldGradient)" stroke="#8B7D2D" stroke-width="0.5"/>
    <path d="M 10,-2 L 16,-5 M 12,0 L 18,-2 M 14,2 L 20,0" stroke="#8B7D2D" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Tail Feathers -->
    <path d="M -3,10 L -4,18 L -2,16 Z" fill="url(#goldGradient)"/>
    <path d="M 0,10 L 0,18 L 1,16 Z" fill="url(#goldGradient)"/>
    <path d="M 3,10 L 4,18 L 2,16 Z" fill="url(#goldGradient)"/>
    
    <!-- Hieroglyphic Elements (simplified) -->
    <circle cx="-25" cy="-12" r="2" fill="none" stroke="#C9B037" stroke-width="1" opacity="0.4"/>
    <path d="M 22,-14 L 22,-10 L 26,-10" stroke="#C9B037" stroke-width="1" opacity="0.4" fill="none"/>
  </g>
  
  <!-- Text: EGYPT -->
  <text x="75" y="40" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="url(#goldGradient)" letter-spacing="2">EGYPT</text>
  
  <!-- Text: ADVISOR TOURS -->
  <text x="75" y="60" font-family="Georgia, serif" font-size="14" font-weight="normal" fill="#8B7D2D" letter-spacing="1.5">ADVISOR TOURS</text>
  
  <!-- Decorative Line -->
  <line x1="75" y1="45" x2="280" y2="45" stroke="#D4AF37" stroke-width="0.5" opacity="0.5"/>
</svg>
