# docker-compose.yml — local development environment matching production.
#
# Usage:
#   cp .env.example .env         # fill in ADMIN_SECRET, ADMIN_PASSWORD, etc.
#   docker-compose up --build    # starts the full-stack app on http://localhost:5000
#
# The React build is produced automatically by the postinstall script
# (scripts/build-client.js).  The data volume persists JSON data files across
# container restarts — equivalent to the DATA_PATH env var on Hostinger.

version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATA_PATH=/data
    env_file:
      - .env
    volumes:
      - app_data:/data
    restart: unless-stopped

volumes:
  app_data:
    driver: local
