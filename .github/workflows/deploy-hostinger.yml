# ============================================================
# Auto-deploy to Hostinger on every push to main
# ============================================================
#
# SETUP CHECKLIST (one-time, done by the repo owner):
#
#  1. In Hostinger hPanel, set up a Node.js application:
#       hPanel → Websites → egyptadvisortours.com → Node.js
#       • Node.js version : 18 (LTS) or higher
#       • Application root : the folder where this repo is deployed, e.g.
#                            /home/u123456789/egyptadvisortours.com
#       • Startup file     : index.js
#       • Click "Create" / "Save"
#
#  2. Enable SSH access for your Hostinger account:
#       hPanel → Advanced → SSH Access → Enable
#       Note your SSH hostname (e.g. server123.web-hosting.com), username,
#       and port (usually 65002 on Hostinger shared/business plans).
#
#  3. Generate a dedicated SSH key-pair on your local machine:
#       ssh-keygen -t ed25519 -C "github-deploy" -f ~/.ssh/hostinger_deploy
#     Add the PUBLIC key (~/.ssh/hostinger_deploy.pub) to Hostinger:
#       hPanel → Advanced → SSH Access → Manage SSH Keys → Add SSH Key
#     Copy the PRIVATE key (~/.ssh/hostinger_deploy) content for step 4.
#
#  4. Add the following GitHub Secrets to this repository:
#       GitHub → Settings → Secrets and variables → Actions → New repository secret
#
#       Secret name                    Example value
#       ──────────────────────────────────────────────────────────────────────
#       HOSTINGER_SSH_HOST             server123.web-hosting.com
#       HOSTINGER_SSH_PORT             65002          (check hPanel SSH page)
#       HOSTINGER_SSH_USER             u123456789     (your Hostinger username)
#       HOSTINGER_SSH_KEY              -----BEGIN OPENSSH PRIVATE KEY----- ...
#       HOSTINGER_APP_DIR              /home/u123456789/egyptadvisortours.com
#       HOSTINGER_SSH_KNOWN_HOSTS      output of: ssh-keyscan -p <PORT> <HOST>
#                                      Run once locally and paste the output as
#                                      the secret value to pin the server key.
#       ADMIN_SECRET                   a-long-random-string (JWT signing key)
#       ADMIN_PASSWORD                 a-secure-password (admin login password)
#
#       Optional:
#       ADMIN_USERNAME                 login username (default: "admin")
#       PAYLOAD_SECRET                 a-long-random-string (Payload CMS JWT key;
#                                      strongly recommended for production)
#       SITE_URL                       https://egyptadvisortours.com  (override if
#                                      the public URL differs from the default)
#       HOSTINGER_DATA_PATH            /home/u123456789/admin_data  (persist data outside repo)
#       REACT_APP_EMAILJS_SERVICE_ID
#       REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID
#       REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID
#       REACT_APP_EMAILJS_PUBLIC_KEY
#
#  5. No manual repository clone is required on first deploy.
#     The workflow will bootstrap HOSTINGER_APP_DIR automatically and clone
#     the repository there if it does not already exist.
#     Make sure HOSTINGER_APP_DIR points to the folder you configured as the
#     Node.js application root in hPanel.
#
#  NOTE — Payload CMS (the /admin panel) runs as a separate Next.js process
#     on port 3001 and is proxied by the main Express server.  The deploy
#     workflow automatically builds and starts it after every deployment.
#     For the CMS to survive server restarts, PM2 must be available on your
#     Hostinger plan (Business or Cloud plans include it).  On plans without
#     PM2 the workflow falls back to nohup, which keeps the process running
#     for the current session but may not survive a full server reboot.
#
# After completing steps 1–5, the first push to `main` will bootstrap the
# app if needed, and later pushes will automatically deploy updates to
# https://egyptadvisortours.com.
# ============================================================

name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:   # also allows manual trigger from GitHub Actions UI

permissions:
  contents: read   # only read access needed; no push/write in this workflow

env:
  # Opt in to Node.js 24 now; avoids deprecation warnings from actions/checkout
  # that will become hard errors when GitHub removes Node.js 20 support.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Job 1: Run all tests before deploying ──────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Run server tests
        run: npm run test:server -- --watchAll=false --forceExit

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Run client tests
        run: npm run test:client -- --watchAll=false --passWithNoTests

  # ── Job 2: Deploy only if tests pass ──────────────────────────────────────
  deploy:
    name: SSH deploy → Hostinger
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://egyptadvisortours.com

    steps:
      # ── 0. Validate required secrets ─────────────────────────────────────
      #    Fail fast with a helpful message before spending time on SSH steps.
      - name: Validate required secrets
        env:
          _HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          _USER: ${{ secrets.HOSTINGER_SSH_USER }}
          _PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          _KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          _DIR: ${{ secrets.HOSTINGER_APP_DIR }}
          _KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          _ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=()
          [ -z "$_HOST" ]          && missing+=("HOSTINGER_SSH_HOST")
          [ -z "$_USER" ]          && missing+=("HOSTINGER_SSH_USER")
          [ -z "$_PORT" ]          && missing+=("HOSTINGER_SSH_PORT")
          [ -z "$_KEY" ]           && missing+=("HOSTINGER_SSH_KEY")
          [ -z "$_DIR" ]           && missing+=("HOSTINGER_APP_DIR")
          [ -z "$_KNOWN_HOSTS" ]   && missing+=("HOSTINGER_SSH_KNOWN_HOSTS (run: ssh-keyscan -p <PORT> <HOST>)")
          [ -z "$_ADMIN_SECRET" ]  && missing+=("ADMIN_SECRET")
          [ -z "$_ADMIN_PASSWORD" ] && missing+=("ADMIN_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi

      # ── 1. Check out code (needed only to verify the workflow itself) ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Add pinned Hostinger SSH host key to known_hosts ───────────
      - name: Add Hostinger to known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ── 3. Write the private key ──────────────────────────────────────
      - name: Install SSH private key
        run: |
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy

      # ── 4a. Write client build-time env vars and server runtime env to the server ──
      #    REACT_APP_* variables are embedded into the React bundle at build
      #    time (triggered by scripts/build-client.js via the postinstall hook).
      #    Because the SSH session on Hostinger does not inherit hPanel env vars,
      #    we pipe them into a gitignored client/.env.production.local file that
      #    Create React App reads automatically during the build.
      #    The file is deleted in step 4b right after npm install completes.
      #    ADMIN_SECRET and ADMIN_PASSWORD are written to a gitignored .env file
      #    so the Node.js server can enforce JWT-based admin auth at runtime.
      #    On first deploy this step also bootstraps the repo if the app directory
      #    does not yet contain a git repository.
      #
      #    SSH resilience: -4 forces IPv4 (avoids "Network is unreachable" on
      #    runners that try IPv6 first), ConnectTimeout=10 fails fast, and the
      #    retry loop retries up to 3 times for transient network errors.
      - name: Write client env vars to server
        env:
          _ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          _PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          _SITE_URL: ${{ secrets.SITE_URL || 'https://egyptadvisortours.com' }}
          _REACT_APP_EMAILJS_SERVICE_ID: ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
          _REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
          _HOSTINGER_DATA_PATH: ${{ secrets.HOSTINGER_DATA_PATH }}
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')

          # Common SSH options used for every connection in this step.
          # -4               : force IPv4 — avoids "Network is unreachable" when the
          #                    runner resolves to an IPv6 address that Hostinger
          #                    does not support.
          # ConnectTimeout=10: give up quickly so retries kick in sooner.
          # BatchMode=yes    : never prompt for a password (fail immediately).
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -4 -o ConnectTimeout=10 -o BatchMode=yes -p $DEPLOY_PORT"

          # Helper: run a remote SSH command with up to 3 attempts.
          ssh_retry() {
            local attempt exit_code
            for attempt in 1 2 3; do
              ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "$1"
              exit_code=$?
              [ "$exit_code" -eq 0 ] && return 0
              if [ "$attempt" -lt 3 ]; then
                echo "SSH attempt $attempt failed (exit $exit_code), retrying in 10s..."
                sleep 10
              fi
            done
            echo "::error::SSH command failed after 3 attempts (exit $exit_code)."
            return 1
          }

          # On first deploy: bootstrap the repo in-place if .git is missing.
          ssh_retry "set -e
            if [ ! -d '${DEPLOY_DIR}/.git' ]; then
              echo '--- first deploy: bootstrapping repository ---'
              mkdir -p '${DEPLOY_DIR}'
              cd '${DEPLOY_DIR}'
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard FETCH_HEAD
            fi
            mkdir -p '${DEPLOY_DIR}/client'"

          # Write build-time env vars to a gitignored file on the server so
          # `npm run build` embeds the correct values in the React bundle.
          env_file=$(mktemp)
          printf '%s\n%s\n%s\n%s\n' \
            "REACT_APP_EMAILJS_SERVICE_ID=${_REACT_APP_EMAILJS_SERVICE_ID}" \
            "REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID=${_REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID}" \
            "REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID=${_REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID}" \
            "REACT_APP_EMAILJS_PUBLIC_KEY=${_REACT_APP_EMAILJS_PUBLIC_KEY}" \
            > "$env_file"

          for attempt in 1 2 3; do
            if ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
                 "umask 077; cat > '${DEPLOY_DIR}/client/.env.production.local'" \
                 < "$env_file"; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Env file write attempt $attempt failed, retrying in 10s..."
              sleep 10
            else
              rm -f "$env_file"
              echo "::error::Failed to write env file to server after 3 attempts."
              exit 1
            fi
          done
          rm -f "$env_file"

          # Write the server runtime .env file containing ADMIN_SECRET and
          # ADMIN_PASSWORD so that the Node.js process enforces JWT-based admin
          # authentication in production.
          server_env_file=$(mktemp)
          printf 'ADMIN_SECRET=%s\nADMIN_PASSWORD=%s\n' \
            "${_ADMIN_SECRET}" "${_ADMIN_PASSWORD}" > "$server_env_file"
          if [ -n "${_ADMIN_USERNAME}" ]; then
            printf 'ADMIN_USERNAME=%s\n' "${_ADMIN_USERNAME}" >> "$server_env_file"
          fi
          _DATA_PATH_CLEAN=$(printf '%s' "${_HOSTINGER_DATA_PATH}" | tr -d '\n\r')
          if [ -n "$_DATA_PATH_CLEAN" ]; then
            printf 'DATA_PATH=%s\n' "$_DATA_PATH_CLEAN" >> "$server_env_file"
            # Tell the Payload CMS where to store its SQLite database (same
            # persistent volume as the JSON data files).
            printf 'DATABASE_PATH=%s/payload.db\n' "$_DATA_PATH_CLEAN" >> "$server_env_file"
          fi
          # PAYLOAD_SECRET signs Payload CMS JWTs — set it via the GitHub
          # Secret PAYLOAD_SECRET (optional but strongly recommended).
          if [ -n "${_PAYLOAD_SECRET}" ]; then
            printf 'PAYLOAD_SECRET=%s\n' "${_PAYLOAD_SECRET}" >> "$server_env_file"
          fi

          for attempt in 1 2 3; do
            if ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
                 "umask 077; cat > '${DEPLOY_DIR}/.env'" \
                 < "$server_env_file"; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Server env file write attempt $attempt failed, retrying in 10s..."
              sleep 10
            else
              rm -f "$server_env_file"
              echo "::error::Failed to write server .env file after 3 attempts."
              exit 1
            fi
          done
          rm -f "$server_env_file"

          # Write cms/.env.local so the Payload CMS Next.js process picks up
          # the correct PAYLOAD_SECRET, DATABASE_PATH, and server URL.
          # Next.js reads .env.local automatically from the app directory.
          cms_env_file=$(mktemp)
          _SITE_URL_CLEAN=$(printf '%s' "${_SITE_URL}" | tr -d '\n\r')
          printf 'PAYLOAD_SERVER_URL=%s\n' "${_SITE_URL_CLEAN:-https://egyptadvisortours.com}" > "$cms_env_file"
          if [ -n "${_PAYLOAD_SECRET}" ]; then
            printf 'PAYLOAD_SECRET=%s\n' "${_PAYLOAD_SECRET}" >> "$cms_env_file"
          fi
          if [ -n "$_DATA_PATH_CLEAN" ]; then
            printf 'DATABASE_PATH=%s/payload.db\n' "$_DATA_PATH_CLEAN" >> "$cms_env_file"
          fi

          for attempt in 1 2 3; do
            if ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
                 "umask 077; mkdir -p '${DEPLOY_DIR}/cms'; cat > '${DEPLOY_DIR}/cms/.env.local'" \
                 < "$cms_env_file"; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "CMS env file write attempt $attempt failed, retrying in 10s..."
              sleep 10
            else
              rm -f "$cms_env_file"
              echo "::error::Failed to write CMS .env.local after 3 attempts."
              exit 1
            fi
          done
          rm -f "$cms_env_file"

      # ── 4b. Pull latest code, build, and restart the app ─────────────
      #    The postinstall hook (scripts/build-client.js) runs on every
      #    `npm install` and builds the React frontend unconditionally
      #    (unless SKIP_CLIENT_BUILD=1 or NODE_ENV=development is set).
      #    After the main app restarts we also install, build, and start the
      #    Payload CMS (cms/) so that /admin is actually served.
      - name: Pull & restart on Hostinger
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')

          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -4 -o ConnectTimeout=10 -o BatchMode=yes -p $DEPLOY_PORT"

          for attempt in 1 2 3; do
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -e
               trap 'rm -f \"${DEPLOY_DIR}/client/.env.production.local\"' EXIT

               # ── Load nvm so node/npm are in PATH ──────────────────────────
               # Non-interactive SSH sessions do not source .bashrc/.bash_profile,
               # so nvm (and therefore node/npm) is not on PATH by default.
               export NVM_DIR=\"\$HOME/.nvm\"
               [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
               # Fallback: add common system npm locations (cPanel / Hostinger)
               command -v npm >/dev/null 2>&1 || export PATH=\"/usr/local/bin:/usr/bin:\$PATH\"
               # Confirm npm is available — fail fast with a clear message if not.
               npm --version || { echo '::error::npm not found. Check Node.js setup on Hostinger.'; exit 1; }

               cd '${DEPLOY_DIR}'

               echo '--- resetting local tracked changes before pull ---'
               echo 'Current git status before reset:'
               git status --short || true
               git reset --hard HEAD
               # npm install in cms/ may create this untracked lockfile on the
               # server; remove it so git pull cannot fail on overwrite checks.
               rm -f cms/package-lock.json

               echo '--- pulling latest code ---'
               git pull origin main

               echo '--- installing main app dependencies (also builds React client) ---'
               npm install --production=false

               echo '--- removing temporary build env file ---'
               rm -f client/.env.production.local

               echo '--- restarting main Node.js app (Passenger) ---'
               mkdir -p tmp
               touch tmp/restart.txt
               # If the host also supports PM2 for the main process:
               # pm2 restart egypt-advisor-tours 2>/dev/null || true

               echo '--- installing CMS dependencies and building (Payload admin panel) ---'
               if npm install --prefix cms --production=false \
                  && npm run build --prefix cms; then
                 echo '--- starting CMS service ---'
                 if command -v pm2 >/dev/null 2>&1; then
                   # When PM2 is available, stop by process name — no need
                   # for pkill or a PID file.
                   if pm2 describe egypt-cms >/dev/null 2>&1; then
                     pm2 restart egypt-cms
                   else
                     pm2 start npm --name egypt-cms -- run start --prefix '${DEPLOY_DIR}/cms'
                   fi
                   pm2 save 2>/dev/null || true
                 else
                   # Nohup fallback: stop the previous instance via the saved
                   # PID file only — avoids any broad pkill pattern.
                   if [ -f '${DEPLOY_DIR}/cms.pid' ]; then
                     kill \$(cat '${DEPLOY_DIR}/cms.pid') 2>/dev/null || true
                     rm -f '${DEPLOY_DIR}/cms.pid'
                     sleep 2
                   fi
                   # Redirect stdin from /dev/null so the process is fully
                   # detached from the terminal.
                   nohup npm run start --prefix '${DEPLOY_DIR}/cms' \
                     > '${DEPLOY_DIR}/cms.log' 2>&1 </dev/null &
                   echo \$! > '${DEPLOY_DIR}/cms.pid'
                   echo \"CMS started in background (PID: \$(cat '${DEPLOY_DIR}/cms.pid'))\"
                 fi
               else
                 echo '::warning::CMS install/build failed — /admin will show an error page until the next successful deploy'
               fi

               echo '--- deploy complete ---'" && break
            if [ "$attempt" -lt 3 ]; then
              echo "Pull & restart attempt $attempt failed, retrying in 10s..."
              sleep 10
            else
              echo "::error::Pull & restart failed after 3 attempts."
              exit 1
            fi
          done

      # ── 5. Health check — verify the deployed site is responding ──────
      - name: Health check
        run: |
          echo "Waiting 15 seconds for the app to finish restarting..."
          sleep 15
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 20 https://egyptadvisortours.com/health || echo "000")
            if [ "$status" = "200" ]; then
              echo "✅ Health check passed (HTTP $status)"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Health check attempt $attempt returned HTTP $status, retrying in 10s..."
              sleep 10
            else
              echo "::error::Health check failed after 3 attempts. Last status: HTTP $status"
              exit 1
            fi
          done

      # ── 6. Print deployment summary ───────────────────────────────────
      - name: Deployment summary
        run: |
          echo "✅ Deployed to https://egyptadvisortours.com"
          echo "   Remote deployment completed successfully."
