name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Run server tests
        run: npm run test:server -- --watchAll=false --forceExit

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Run client tests
        run: npm run test:client -- --watchAll=false --passWithNoTests

  deploy:
    name: SSH deploy → Hostinger
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://egyptadvisortours.com

    steps:
      - name: Validate required secrets
        env:
          _HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          _USER: ${{ secrets.HOSTINGER_SSH_USER }}
          _PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          _KEY_B64: ${{ secrets.HOSTINGER_SSH_KEY_B64 }}
          _DIR: ${{ secrets.HOSTINGER_APP_DIR }}
          _KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          _ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          _HOSTINGER_DATA_PATH: ${{ secrets.HOSTINGER_DATA_PATH }}
          _PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          _CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          _REACT_APP_SITE_URL: ${{ secrets.REACT_APP_SITE_URL }}
          _REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          _REACT_APP_EMAILJS_SERVICE_ID: ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
          _REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
        run: |
          missing=()
          [ -z "$_HOST" ] && missing+=("HOSTINGER_SSH_HOST")
          [ -z "$_USER" ] && missing+=("HOSTINGER_SSH_USER")
          [ -z "$_PORT" ] && missing+=("HOSTINGER_SSH_PORT")
          [ -z "$_KEY_B64" ] && missing+=("HOSTINGER_SSH_KEY_B64")
          [ -z "$_DIR" ] && missing+=("HOSTINGER_APP_DIR")
          [ -z "$_KNOWN_HOSTS" ] && missing+=("HOSTINGER_SSH_KNOWN_HOSTS")
          [ -z "$_ADMIN_SECRET" ] && missing+=("ADMIN_SECRET")
          [ -z "$_ADMIN_PASSWORD" ] && missing+=("ADMIN_PASSWORD")
          [ -z "$_HOSTINGER_DATA_PATH" ] && missing+=("HOSTINGER_DATA_PATH")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          warnings=()
          [ -z "$_PUBLIC_SITE_URL" ] && warnings+=("PUBLIC_SITE_URL")
          [ -z "$_CORS_ORIGIN" ] && warnings+=("CORS_ORIGIN")
          [ -z "$_REACT_APP_SITE_URL" ] && warnings+=("REACT_APP_SITE_URL")
          [ -z "$_REACT_APP_EMAILJS_SERVICE_ID" ] && warnings+=("REACT_APP_EMAILJS_SERVICE_ID")
          [ -z "$_REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID" ] && warnings+=("REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID")
          [ -z "$_REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID" ] && warnings+=("REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID")
          [ -z "$_REACT_APP_EMAILJS_PUBLIC_KEY" ] && warnings+=("REACT_APP_EMAILJS_PUBLIC_KEY")
          if [ ${#warnings[@]} -gt 0 ]; then
            echo "::warning::Optional GitHub Secrets missing; will preserve existing Hostinger .env values: ${warnings[*]}"
          fi
          case "$_HOSTINGER_DATA_PATH" in
            /*) ;;
            *)
              echo "::error::HOSTINGER_DATA_PATH must be an absolute path starting with /"
              exit 1
              ;;
          esac
          case "$_HOSTINGER_DATA_PATH" in
            *$'\n'*|*$'\r'*|*[[:space:]]*)
              echo "::error::HOSTINGER_DATA_PATH must not contain whitespace or newlines"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Add Hostinger to known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install SSH private key
        run: |
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/hostinger_deploy
          [ -s ~/.ssh/hostinger_deploy ] || { echo "::error::Decoded SSH key file is empty."; exit 1; }
          grep -q '^-----BEGIN .*PRIVATE KEY-----$' ~/.ssh/hostinger_deploy || {
            echo "::error::Decoded SSH key does not start with a valid PRIVATE KEY header."
            exit 1
          }
          chmod 600 ~/.ssh/hostinger_deploy

      - name: Inspect SSH private key file (safe)
        run: |
          echo "Path: $HOME/.ssh/hostinger_deploy"
          ls -l "$HOME/.ssh/hostinger_deploy"
          wc -c "$HOME/.ssh/hostinger_deploy"
          line_count=$(wc -l < "$HOME/.ssh/hostinger_deploy" | tr -d '[:space:]')
          first_line=$(sed -n '1p' "$HOME/.ssh/hostinger_deploy")
          last_line=$(sed -n '$p' "$HOME/.ssh/hostinger_deploy")
          mask_line() {
            case "$1" in
              "-----BEGIN "*|"-----END "*) printf '%s\n' "$1" ;;
              *) echo "[redacted-non-marker]" ;;
            esac
          }
          echo "Line count: $line_count"
          echo "First line: $(mask_line "$first_line")"
          echo "Last line: $(mask_line "$last_line")"

      - name: Validate SSH private key format
        run: |
          if ssh-keygen -l -f ~/.ssh/hostinger_deploy >/dev/null; then
            echo "SSH private key format is valid."
          else
            echo "::error::Invalid SSH private key format."
            exit 1
          fi

      - name: Verify SSH connectivity
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"
          echo "Checking SSH connection to ${DEPLOY_HOST}:${DEPLOY_PORT} as ${DEPLOY_USER}"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "echo SSH preflight OK"

      - name: Write environment files to server
        env:
          _ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          _HOSTINGER_DATA_PATH: ${{ secrets.HOSTINGER_DATA_PATH }}
          _PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          _CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          _REACT_APP_SITE_URL: ${{ secrets.REACT_APP_SITE_URL }}
          _REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          _REACT_APP_EMAILJS_SERVICE_ID: ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
          _REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"
          PUBLIC_SITE_URL="${_PUBLIC_SITE_URL:-https://egyptadvisortours.com}"
          CORS_ORIGIN="${_CORS_ORIGIN:-$PUBLIC_SITE_URL}"
          REACT_APP_SITE_URL="${_REACT_APP_SITE_URL:-$PUBLIC_SITE_URL}"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            mkdir -p '${DEPLOY_DIR}'
            if [ ! -d '${DEPLOY_DIR}/.git' ]; then
              cd '${DEPLOY_DIR}'
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            mkdir -p '${DEPLOY_DIR}/client'"

          client_env_file=$(mktemp)
          printf '%s\n%s\n%s\n%s\n%s\n' \
            "REACT_APP_SITE_URL=${REACT_APP_SITE_URL}" \
            "REACT_APP_EMAILJS_SERVICE_ID=${_REACT_APP_EMAILJS_SERVICE_ID}" \
            "REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID=${_REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID}" \
            "REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID=${_REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID}" \
            "REACT_APP_EMAILJS_PUBLIC_KEY=${_REACT_APP_EMAILJS_PUBLIC_KEY}" \
            > "$client_env_file"
          [ -n "${_REACT_APP_API_URL}" ] && printf 'REACT_APP_API_URL=%s\n' "${_REACT_APP_API_URL}" >> "$client_env_file"

          if ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "[ -f '${DEPLOY_DIR}/client/.env.production.local' ]"; then
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "cat '${DEPLOY_DIR}/client/.env.production.local'" > /tmp/hostinger_client_env_prev.txt
            while IFS='=' read -r key value; do
              [ -z "$key" ] && continue
              case "$key" in
                REACT_APP_SITE_URL|REACT_APP_API_URL|REACT_APP_EMAILJS_SERVICE_ID|REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID|REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID|REACT_APP_EMAILJS_PUBLIC_KEY) ;;
                *) printf '%s=%s\n' "$key" "$value" >> "$client_env_file" ;;
              esac
            done < /tmp/hostinger_client_env_prev.txt
            rm -f /tmp/hostinger_client_env_prev.txt
          fi

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '${DEPLOY_DIR}/client/.env.production.local'" < "$client_env_file"
          rm -f "$client_env_file"

          server_env_file=$(mktemp)
          printf 'PUBLIC_SITE_URL=%s\n' "${PUBLIC_SITE_URL}" >> "$server_env_file"
          printf 'CORS_ORIGIN=%s\n' "${CORS_ORIGIN}" >> "$server_env_file"
          [ -n "${_ADMIN_USERNAME}" ] && printf 'ADMIN_USERNAME=%s\n' "${_ADMIN_USERNAME}" >> "$server_env_file"
          [ -n "${_ADMIN_SECRET}" ] && printf 'ADMIN_SECRET=%s\n' "${_ADMIN_SECRET}" >> "$server_env_file"
          [ -n "${_ADMIN_PASSWORD}" ] && printf 'ADMIN_PASSWORD=%s\n' "${_ADMIN_PASSWORD}" >> "$server_env_file"
          [ -n "${_HOSTINGER_DATA_PATH}" ] && printf 'HOSTINGER_DATA_PATH=%s\n' "${_HOSTINGER_DATA_PATH}" >> "$server_env_file"

          if ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "[ -f '${DEPLOY_DIR}/.env' ]"; then
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "cat '${DEPLOY_DIR}/.env'" > /tmp/hostinger_server_env_prev.txt
            while IFS='=' read -r key value; do
              [ -z "$key" ] && continue
              case "$key" in
                PUBLIC_SITE_URL|CORS_ORIGIN|ADMIN_USERNAME|ADMIN_SECRET|ADMIN_PASSWORD|HOSTINGER_DATA_PATH) ;;
                *) printf '%s=%s\n' "$key" "$value" >> "$server_env_file" ;;
              esac
            done < /tmp/hostinger_server_env_prev.txt
            rm -f /tmp/hostinger_server_env_prev.txt
          fi

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '${DEPLOY_DIR}/.env'" < "$server_env_file"
          rm -f "$server_env_file"

      - name: Verify env files on server
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "
            check_env_file() {
              local label=\"\$1\"
              local path=\"\$2\"
              if [ -f \"\$path\" ]; then
                perms_size=\$(ls -l \"\$path\" | awk '{print \"permissions=\" \$1 \" size=\" \$5 \"B\"}')
                echo \"\$label: present (\$perms_size)\"
              else
                echo \"::warning::\$label not found at \$path — env file may not have been written correctly\"
              fi
            }
            check_env_key() {
              local label=\"\$1\"
              local path=\"\$2\"
              local key=\"\$3\"
              local required=\"\$4\"
              if grep -q \"^\${key}=\" \"\$path\"; then
                echo \"\$label: \${key} present\"
              elif [ \"\$required\" = \"required\" ]; then
                echo \"::error::\$label missing required key \${key}\"
                return 1
              else
                echo \"::warning::\$label missing optional key \${key}\"
              fi
            }
            fail=0
            server_env='${DEPLOY_DIR}/.env'
            client_env='${DEPLOY_DIR}/client/.env.production.local'
            check_env_file 'Server .env' '${DEPLOY_DIR}/.env'
            check_env_file 'Client .env.production.local' '${DEPLOY_DIR}/client/.env.production.local'
            check_env_key 'Server .env' \"\$server_env\" 'PUBLIC_SITE_URL' optional || true
            check_env_key 'Server .env' \"\$server_env\" 'CORS_ORIGIN' optional || true
            check_env_key 'Client .env.production.local' \"\$client_env\" 'REACT_APP_SITE_URL' optional || true
            if [ \"\$fail\" -ne 0 ]; then
              exit 1
            fi
          "

      - name: Pull & restart on Hostinger
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
            command -v npm >/dev/null 2>&1 || export PATH=\"/usr/local/bin:/usr/bin:\$PATH\"
            npm --version
            cd '${DEPLOY_DIR}'
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            npm install --production=false
            mkdir -p tmp
            touch tmp/restart.txt"

      - name: Verify env files after restart
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "
            check_env_file() {
              local label=\"\$1\"
              local path=\"\$2\"
              if [ -f \"\$path\" ]; then
                perms_size=\$(ls -l \"\$path\" | awk '{print \"permissions=\" \$1 \" size=\" \$5 \"B\"}')
                echo \"\$label: present (\$perms_size)\"
              else
                echo \"::warning::\$label not found at \$path after restart — app may start without required env vars\"
              fi
            }
            check_env_key() {
              local label=\"\$1\"
              local path=\"\$2\"
              local key=\"\$3\"
              local required=\"\$4\"
              if grep -q \"^\${key}=\" \"\$path\"; then
                echo \"\$label: \${key} present after restart\"
              elif [ \"\$required\" = \"required\" ]; then
                echo \"::error::\$label missing required key \${key} after restart\"
                return 1
              else
                echo \"::warning::\$label missing optional key \${key}\"
              fi
            }
            fail=0
            server_env='${DEPLOY_DIR}/.env'
            client_env='${DEPLOY_DIR}/client/.env.production.local'
            check_env_file 'Server .env' '${DEPLOY_DIR}/.env'
            check_env_file 'Client .env.production.local' '${DEPLOY_DIR}/client/.env.production.local'
            check_env_key 'Server .env' \"\$server_env\" 'PUBLIC_SITE_URL' optional || true
            check_env_key 'Server .env' \"\$server_env\" 'CORS_ORIGIN' optional || true
            check_env_key 'Client .env.production.local' \"\$client_env\" 'REACT_APP_SITE_URL' optional || true
            if [ \"\$fail\" -ne 0 ]; then
              exit 1
            fi
          "

      - name: Health check
        run: |
          sleep 20
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"
          node_count=$(ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "ps -eo cmd | grep -E '[n]ode .*start\\.js|[n]ode .*server/index\\.js' | wc -l | tr -d '[:space:]'")
          echo "Detected Node app process count after restart: ${node_count:-0}"
          if [ "${node_count:-0}" -gt 1 ]; then
            echo "::error::Multiple Node app processes detected after restart."
            exit 1
          fi
          run_check() {
            local url="$1"
            local mode="$2"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            case "$mode:$status" in
              strict:2[0-9][0-9]|redirect-ok:2[0-9][0-9]|redirect-ok:3[0-9][0-9]) return 0 ;;
            esac
            echo "::error::Health check failed for $url (HTTP $status)"
            exit 1
          }
          run_check_info() {
            local url="$1"
            local label="$2"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            case "$status" in
              2[0-9][0-9])
                echo "${label}: OK (HTTP ${status})"
                ;;
              *)
                echo "::warning::${label} returned HTTP ${status} — app may be degraded. URL: ${url}"
                echo "${label}: DEGRADED (HTTP ${status})"
                ;;
            esac
          }
          run_check "https://egyptadvisortours.com/health" "strict"
          echo "App liveness: OK"
          run_check_info "https://egyptadvisortours.com/api/admin/health" "Admin health"
          run_check "https://egyptadvisortours.com/admin" "redirect-ok"
          run_check "https://egyptadvisortours.com/api/tours" "strict"
          run_check "https://egyptadvisortours.com/api/homepage" "strict"
          echo "Content endpoints: OK"

      - name: Deployment summary
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          REACT_APP_SITE_URL: ${{ secrets.REACT_APP_SITE_URL }}
        run: |
          echo "✅ Deployed to https://egyptadvisortours.com"
          echo "Public site URL configured from secret: ${PUBLIC_SITE_URL:-no}"
          echo "Client site URL configured from secret: ${REACT_APP_SITE_URL:-no}"
