name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Run server tests
        run: npm run test:server -- --watchAll=false --forceExit

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Run client tests
        run: npm run test:client -- --watchAll=false --passWithNoTests

  deploy:
    name: SSH deploy → Hostinger
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://egyptadvisortours.com

    steps:
      - name: Validate required secrets
        env:
          _HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          _USER: ${{ secrets.HOSTINGER_SSH_USER }}
          _PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          _KEY_B64: ${{ secrets.HOSTINGER_SSH_KEY_B64 }}
          _DIR: ${{ secrets.HOSTINGER_APP_DIR }}
          _KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          _ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _CMS_PROVIDER: ${{ secrets.CMS_PROVIDER }}
          _WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          _STORYBLOK_PREVIEW_TOKEN: ${{ secrets.STORYBLOK_PREVIEW_TOKEN }}
          _HOSTINGER_DATA_PATH: ${{ secrets.HOSTINGER_DATA_PATH }}
        run: |
          missing=()
          [ -z "$_HOST" ] && missing+=("HOSTINGER_SSH_HOST")
          [ -z "$_USER" ] && missing+=("HOSTINGER_SSH_USER")
          [ -z "$_PORT" ] && missing+=("HOSTINGER_SSH_PORT")
          [ -z "$_KEY_B64" ] && missing+=("HOSTINGER_SSH_KEY_B64")
          [ -z "$_DIR" ] && missing+=("HOSTINGER_APP_DIR")
          [ -z "$_KNOWN_HOSTS" ] && missing+=("HOSTINGER_SSH_KNOWN_HOSTS")
          [ -z "$_ADMIN_SECRET" ] && missing+=("ADMIN_SECRET")
          [ -z "$_ADMIN_PASSWORD" ] && missing+=("ADMIN_PASSWORD")
          [ -z "$_HOSTINGER_DATA_PATH" ] && missing+=("HOSTINGER_DATA_PATH")
          CMS_PROVIDER="${_CMS_PROVIDER:-auto}"
          case "$CMS_PROVIDER" in
            storyblok|wordpress|filesystem|auto) ;;
            *)
              echo "::error::CMS_PROVIDER must be one of: storyblok, wordpress, filesystem, auto"
              exit 1
              ;;
          esac
          if [ "$CMS_PROVIDER" = "storyblok" ] && [ -z "$_STORYBLOK_PREVIEW_TOKEN" ]; then
            missing+=("STORYBLOK_PREVIEW_TOKEN")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          case "$_HOSTINGER_DATA_PATH" in
            /*) ;;
            *)
              echo "::error::HOSTINGER_DATA_PATH must be an absolute path starting with /"
              exit 1
              ;;
          esac
          case "$_HOSTINGER_DATA_PATH" in
            *$'\n'*|*$'\r'*|*[[:space:]]*)
              echo "::error::HOSTINGER_DATA_PATH must not contain whitespace or newlines"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Add Hostinger to known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install SSH private key
        run: |
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/hostinger_deploy
          [ -s ~/.ssh/hostinger_deploy ] || { echo "::error::Decoded SSH key file is empty."; exit 1; }
          grep -q '^-----BEGIN .*PRIVATE KEY-----$' ~/.ssh/hostinger_deploy || {
            echo "::error::Decoded SSH key does not start with a valid PRIVATE KEY header."
            exit 1
          }
          chmod 600 ~/.ssh/hostinger_deploy

      - name: Inspect SSH private key file (safe)
        run: |
          echo "Path: $HOME/.ssh/hostinger_deploy"
          ls -l "$HOME/.ssh/hostinger_deploy"
          wc -c "$HOME/.ssh/hostinger_deploy"
          line_count=$(wc -l < "$HOME/.ssh/hostinger_deploy" | tr -d '[:space:]')
          first_line=$(sed -n '1p' "$HOME/.ssh/hostinger_deploy")
          last_line=$(sed -n '$p' "$HOME/.ssh/hostinger_deploy")
          mask_line() {
            case "$1" in
              "-----BEGIN "*|"-----END "*) printf '%s\n' "$1" ;;
              *) echo "[redacted-non-marker]" ;;
            esac
          }
          echo "Line count: $line_count"
          echo "First line: $(mask_line "$first_line")"
          echo "Last line: $(mask_line "$last_line")"

      - name: Validate SSH private key format
        run: |
          if ssh-keygen -l -f ~/.ssh/hostinger_deploy >/dev/null; then
            echo "SSH private key format is valid."
          else
            echo "::error::Invalid SSH private key format."
            exit 1
          fi

      - name: Verify SSH connectivity
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"
          echo "Checking SSH connection to ${DEPLOY_HOST}:${DEPLOY_PORT} as ${DEPLOY_USER}"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "echo SSH preflight OK"

      - name: Write environment files to server
        env:
          _ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          _CMS_PROVIDER: ${{ secrets.CMS_PROVIDER }}
          _HOSTINGER_DATA_PATH: ${{ secrets.HOSTINGER_DATA_PATH }}
          _WORDPRESS_BASE_URL: ${{ secrets.WORDPRESS_BASE_URL }}
          _WORDPRESS_API_NAMESPACE: ${{ secrets.WORDPRESS_API_NAMESPACE }}
          _WORDPRESS_TIMEOUT_MS: ${{ secrets.WORDPRESS_TIMEOUT_MS }}
          _WORDPRESS_HEALTH_TIMEOUT_MS: ${{ secrets.WORDPRESS_HEALTH_TIMEOUT_MS }}
          _STORYBLOK_PREVIEW_TOKEN: ${{ secrets.STORYBLOK_PREVIEW_TOKEN }}
          _STORYBLOK_SPACE_ID: ${{ secrets.STORYBLOK_SPACE_ID }}
          _STORYBLOK_EDITOR_URL: ${{ secrets.STORYBLOK_EDITOR_URL }}
          _STORYBLOK_MANAGEMENT_TOKEN: ${{ secrets.STORYBLOK_MANAGEMENT_TOKEN }}
          _STORYBLOK_PREVIEW_SECRET: ${{ secrets.STORYBLOK_PREVIEW_SECRET }}
          _STORYBLOK_REGION: ${{ secrets.STORYBLOK_REGION }}
          _REACT_APP_EMAILJS_SERVICE_ID: ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
          _REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            mkdir -p '${DEPLOY_DIR}'
            if [ ! -d '${DEPLOY_DIR}/.git' ]; then
              cd '${DEPLOY_DIR}'
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            mkdir -p '${DEPLOY_DIR}/client'"

          client_env_file=$(mktemp)
          printf '%s\n%s\n%s\n%s\n' \
            "REACT_APP_EMAILJS_SERVICE_ID=${_REACT_APP_EMAILJS_SERVICE_ID}" \
            "REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID=${_REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID}" \
            "REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID=${_REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID}" \
            "REACT_APP_EMAILJS_PUBLIC_KEY=${_REACT_APP_EMAILJS_PUBLIC_KEY}" \
            > "$client_env_file"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '${DEPLOY_DIR}/client/.env.production.local'" < "$client_env_file"
          rm -f "$client_env_file"

          server_env_file=$(mktemp)
          printf 'ADMIN_SECRET=%s\nADMIN_PASSWORD=%s\nDATA_PATH=%s\nCMS_PROVIDER=%s\n' \
            "${_ADMIN_SECRET}" "${_ADMIN_PASSWORD}" "${_HOSTINGER_DATA_PATH}" "${_CMS_PROVIDER:-auto}" > "$server_env_file"
          [ -n "${_STORYBLOK_PREVIEW_TOKEN}" ] && printf 'STORYBLOK_PREVIEW_TOKEN=%s\n' "${_STORYBLOK_PREVIEW_TOKEN}" >> "$server_env_file"
          [ -n "${_WORDPRESS_BASE_URL}" ] && printf 'WORDPRESS_BASE_URL=%s\n' "${_WORDPRESS_BASE_URL}" >> "$server_env_file"
          [ -n "${_WORDPRESS_API_NAMESPACE}" ] && printf 'WORDPRESS_API_NAMESPACE=%s\n' "${_WORDPRESS_API_NAMESPACE}" >> "$server_env_file"
          [ -n "${_WORDPRESS_TIMEOUT_MS}" ] && printf 'WORDPRESS_TIMEOUT_MS=%s\n' "${_WORDPRESS_TIMEOUT_MS}" >> "$server_env_file"
          [ -n "${_WORDPRESS_HEALTH_TIMEOUT_MS}" ] && printf 'WORDPRESS_HEALTH_TIMEOUT_MS=%s\n' "${_WORDPRESS_HEALTH_TIMEOUT_MS}" >> "$server_env_file"
          [ -n "${_ADMIN_USERNAME}" ] && printf 'ADMIN_USERNAME=%s\n' "${_ADMIN_USERNAME}" >> "$server_env_file"
          [ -n "${_STORYBLOK_SPACE_ID}" ] && printf 'STORYBLOK_SPACE_ID=%s\n' "${_STORYBLOK_SPACE_ID}" >> "$server_env_file"
          [ -n "${_STORYBLOK_EDITOR_URL}" ] && printf 'STORYBLOK_EDITOR_URL=%s\n' "${_STORYBLOK_EDITOR_URL}" >> "$server_env_file"
          [ -n "${_STORYBLOK_MANAGEMENT_TOKEN}" ] && printf 'STORYBLOK_MANAGEMENT_TOKEN=%s\n' "${_STORYBLOK_MANAGEMENT_TOKEN}" >> "$server_env_file"
          [ -n "${_STORYBLOK_PREVIEW_SECRET}" ] && printf 'STORYBLOK_PREVIEW_SECRET=%s\n' "${_STORYBLOK_PREVIEW_SECRET}" >> "$server_env_file"
          [ -n "${_STORYBLOK_REGION}" ] && printf 'STORYBLOK_REGION=%s\n' "${_STORYBLOK_REGION}" >> "$server_env_file"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '${DEPLOY_DIR}/.env'" < "$server_env_file"
          rm -f "$server_env_file"

      - name: Verify env files on server
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "
            check_env_file() {
              local label=\"\$1\"
              local path=\"\$2\"
              if [ -f \"\$path\" ]; then
                perms_size=\$(ls -l \"\$path\" | awk '{print \"permissions=\" \$1 \" size=\" \$5 \"B\"}')
                echo \"\$label: present (\$perms_size)\"
              else
                echo \"::warning::\$label not found at \$path — env file may not have been written correctly\"
              fi
            }
            check_env_file 'Server .env' '${DEPLOY_DIR}/.env'
            check_env_file 'Client .env.production.local' '${DEPLOY_DIR}/client/.env.production.local'
          "

      - name: Pull & restart on Hostinger
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
            command -v npm >/dev/null 2>&1 || export PATH=\"/usr/local/bin:/usr/bin:\$PATH\"
            npm --version
            cd '${DEPLOY_DIR}'
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            npm install --production=false
            mkdir -p tmp
            touch tmp/restart.txt"

      - name: Verify env files after restart
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -o ConnectTimeout=20 -o ConnectionAttempts=3 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "
            check_env_file() {
              local label=\"\$1\"
              local path=\"\$2\"
              if [ -f \"\$path\" ]; then
                perms_size=\$(ls -l \"\$path\" | awk '{print \"permissions=\" \$1 \" size=\" \$5 \"B\"}')
                echo \"\$label: present (\$perms_size)\"
              else
                echo \"::warning::\$label not found at \$path after restart — app may start without required env vars\"
              fi
            }
            check_env_file 'Server .env' '${DEPLOY_DIR}/.env'
            check_env_file 'Client .env.production.local' '${DEPLOY_DIR}/client/.env.production.local'
          "

      - name: Health check
        run: |
          sleep 20
          run_check() {
            local url="$1"
            local mode="$2"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            case "$mode:$status" in
              strict:2[0-9][0-9]|redirect-ok:2[0-9][0-9]|redirect-ok:3[0-9][0-9]) return 0 ;;
            esac
            echo "::error::Health check failed for $url (HTTP $status)"
            exit 1
          }
          run_check_info() {
            local url="$1"
            local label="$2"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            case "$status" in
              2[0-9][0-9])
                echo "${label}: OK (HTTP ${status})"
                ;;
              *)
                echo "::warning::${label} returned HTTP ${status} — CMS may be degraded but app is still up. URL: ${url}"
                echo "${label}: DEGRADED (HTTP ${status})"
                ;;
            esac
          }
          run_check "https://egyptadvisortours.com/health" "strict"
          echo "App liveness: OK"
          run_check_info "https://egyptadvisortours.com/api/admin/health" "CMS health"
          run_check "https://egyptadvisortours.com/admin" "redirect-ok"
          echo "Admin route: OK"

      - name: Deployment summary
        run: |
          echo "✅ Deployed to https://egyptadvisortours.com"
