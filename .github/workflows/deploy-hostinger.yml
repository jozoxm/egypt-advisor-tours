name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Run server tests
        run: npm run test:server -- --watchAll=false --forceExit

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Run client tests
        run: npm run test:client -- --watchAll=false --passWithNoTests

  deploy:
    name: SSH deploy → Hostinger
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://egyptadvisortours.com

    steps:
      - name: Validate required secrets
        env:
          _HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          _USER: ${{ secrets.HOSTINGER_SSH_USER }}
          _PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          _KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          _DIR: ${{ secrets.HOSTINGER_APP_DIR }}
          _KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          _ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _STORYBLOK_PREVIEW_TOKEN: ${{ secrets.STORYBLOK_PREVIEW_TOKEN }}
          _HOSTINGER_DATA_PATH: ${{ secrets.HOSTINGER_DATA_PATH }}
        run: |
          missing=()
          [ -z "$_HOST" ] && missing+=("HOSTINGER_SSH_HOST")
          [ -z "$_USER" ] && missing+=("HOSTINGER_SSH_USER")
          [ -z "$_PORT" ] && missing+=("HOSTINGER_SSH_PORT")
          [ -z "$_KEY" ] && missing+=("HOSTINGER_SSH_KEY")
          [ -z "$_DIR" ] && missing+=("HOSTINGER_APP_DIR")
          [ -z "$_KNOWN_HOSTS" ] && missing+=("HOSTINGER_SSH_KNOWN_HOSTS")
          [ -z "$_ADMIN_SECRET" ] && missing+=("ADMIN_SECRET")
          [ -z "$_ADMIN_PASSWORD" ] && missing+=("ADMIN_PASSWORD")
          [ -z "$_STORYBLOK_PREVIEW_TOKEN" ] && missing+=("STORYBLOK_PREVIEW_TOKEN")
          [ -z "$_HOSTINGER_DATA_PATH" ] && missing+=("HOSTINGER_DATA_PATH")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          case "$_HOSTINGER_DATA_PATH" in
            /*) ;;
            *)
              echo "::error::HOSTINGER_DATA_PATH must be an absolute path starting with /"
              exit 1
              ;;
          esac
          case "$_HOSTINGER_DATA_PATH" in
            *$'\n'*|*$'\r'*|*[[:space:]]*)
              echo "::error::HOSTINGER_DATA_PATH must not contain whitespace or newlines"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Add Hostinger to known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install SSH private key
        run: |
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy

      - name: Write environment files to server
        env:
          _ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          _ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          _ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          _HOSTINGER_DATA_PATH: ${{ secrets.HOSTINGER_DATA_PATH }}
          _STORYBLOK_PREVIEW_TOKEN: ${{ secrets.STORYBLOK_PREVIEW_TOKEN }}
          _STORYBLOK_SPACE_ID: ${{ secrets.STORYBLOK_SPACE_ID }}
          _STORYBLOK_EDITOR_URL: ${{ secrets.STORYBLOK_EDITOR_URL }}
          _STORYBLOK_MANAGEMENT_TOKEN: ${{ secrets.STORYBLOK_MANAGEMENT_TOKEN }}
          _STORYBLOK_PREVIEW_SECRET: ${{ secrets.STORYBLOK_PREVIEW_SECRET }}
          _STORYBLOK_REGION: ${{ secrets.STORYBLOK_REGION }}
          _REACT_APP_EMAILJS_SERVICE_ID: ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
          _REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID }}
          _REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -4 -o ConnectTimeout=10 -o BatchMode=yes -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            mkdir -p '${DEPLOY_DIR}'
            if [ ! -d '${DEPLOY_DIR}/.git' ]; then
              cd '${DEPLOY_DIR}'
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            mkdir -p '${DEPLOY_DIR}/client'"

          client_env_file=$(mktemp)
          printf '%s\n%s\n%s\n%s\n' \
            "REACT_APP_EMAILJS_SERVICE_ID=${_REACT_APP_EMAILJS_SERVICE_ID}" \
            "REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID=${_REACT_APP_EMAILJS_BOOKING_TEMPLATE_ID}" \
            "REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID=${_REACT_APP_EMAILJS_TRIPTAILOR_TEMPLATE_ID}" \
            "REACT_APP_EMAILJS_PUBLIC_KEY=${_REACT_APP_EMAILJS_PUBLIC_KEY}" \
            > "$client_env_file"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '${DEPLOY_DIR}/client/.env.production.local'" < "$client_env_file"
          rm -f "$client_env_file"

          server_env_file=$(mktemp)
          printf 'ADMIN_SECRET=%s\nADMIN_PASSWORD=%s\nDATA_PATH=%s\nSTORYBLOK_PREVIEW_TOKEN=%s\n' \
            "${_ADMIN_SECRET}" "${_ADMIN_PASSWORD}" "${_HOSTINGER_DATA_PATH}" "${_STORYBLOK_PREVIEW_TOKEN}" > "$server_env_file"
          [ -n "${_ADMIN_USERNAME}" ] && printf 'ADMIN_USERNAME=%s\n' "${_ADMIN_USERNAME}" >> "$server_env_file"
          [ -n "${_STORYBLOK_SPACE_ID}" ] && printf 'STORYBLOK_SPACE_ID=%s\n' "${_STORYBLOK_SPACE_ID}" >> "$server_env_file"
          [ -n "${_STORYBLOK_EDITOR_URL}" ] && printf 'STORYBLOK_EDITOR_URL=%s\n' "${_STORYBLOK_EDITOR_URL}" >> "$server_env_file"
          [ -n "${_STORYBLOK_MANAGEMENT_TOKEN}" ] && printf 'STORYBLOK_MANAGEMENT_TOKEN=%s\n' "${_STORYBLOK_MANAGEMENT_TOKEN}" >> "$server_env_file"
          [ -n "${_STORYBLOK_PREVIEW_SECRET}" ] && printf 'STORYBLOK_PREVIEW_SECRET=%s\n' "${_STORYBLOK_PREVIEW_SECRET}" >> "$server_env_file"
          [ -n "${_STORYBLOK_REGION}" ] && printf 'STORYBLOK_REGION=%s\n' "${_STORYBLOK_REGION}" >> "$server_env_file"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '${DEPLOY_DIR}/.env'" < "$server_env_file"
          rm -f "$server_env_file"

      - name: Pull & restart on Hostinger
        run: |
          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
          DEPLOY_USER=$(printf '%s' "${{ secrets.HOSTINGER_SSH_USER }}" | tr -d '[:space:]')
          DEPLOY_PORT=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PORT }}" | tr -d '[:space:]')
          DEPLOY_DIR=$(printf '%s' "${{ secrets.HOSTINGER_APP_DIR }}" | tr -d '[:space:]')
          SSH_OPTS="-i $HOME/.ssh/hostinger_deploy -4 -o ConnectTimeout=10 -o BatchMode=yes -p $DEPLOY_PORT"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
            command -v npm >/dev/null 2>&1 || export PATH=\"/usr/local/bin:/usr/bin:\$PATH\"
            npm --version
            cd '${DEPLOY_DIR}'
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            npm install --production=false
            rm -f client/.env.production.local
            mkdir -p tmp
            touch tmp/restart.txt"

      - name: Health check
        run: |
          sleep 20
          run_check() {
            local url="$1"
            local mode="$2"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            case "$mode:$status" in
              strict:2[0-9][0-9]|redirect-ok:2[0-9][0-9]|redirect-ok:3[0-9][0-9]) return 0 ;;
            esac
            echo "::error::Health check failed for $url (HTTP $status)"
            exit 1
          }
          run_check "https://egyptadvisortours.com/health" "strict"
          run_check "https://egyptadvisortours.com/api/admin/health" "strict"
          run_check "https://egyptadvisortours.com/admin" "redirect-ok"

      - name: Deployment summary
        run: |
          echo "✅ Deployed to https://egyptadvisortours.com"
