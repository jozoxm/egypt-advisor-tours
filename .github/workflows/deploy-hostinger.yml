diff --git a/.github/workflows/deploy-hostinger.yml b/.github/workflows/deploy-hostinger.yml
--- a/.github/workflows/deploy-hostinger.yml
+++ b/.github/workflows/deploy-hostinger.yml
@@ -122,11 +122,22 @@ jobs:
           printf '%s\n' "${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
           chmod 600 ~/.ssh/known_hosts
 
       - name: Install SSH private key
         run: |
-          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_deploy
+          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/hostinger_deploy
           chmod 600 ~/.ssh/hostinger_deploy
+
+      - name: Validate SSH private key format
+        run: |
+          ssh-keygen -l -f ~/.ssh/hostinger_deploy
+
+      - name: Verify SSH connectivity
+        run: |
+          DEPLOY_HOST=$(printf '%s' "${{ secrets.HOSTINGER_SSH_HOST }}" | tr -d '[:space:]')
